# Usage:  docker compose up -d neo4j   (browser: http://localhost:7474, login neo4j / password)
#         docker compose run --rm importer   (runs the 3 import steps once Neo4j is healthy)
# Then run the Cypher in listings/ (e.g. 5a.11 - 5a.16) in Neo4j Browser. GDS is installed for 5a.13/5a.14.
name: ch05_a
services:
  neo4j:
    image: neo4j:5-community
    container_name: ch05_a-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/password            # matches ../../config.ini
      NEO4J_PLUGINS: '["graph-data-science"]'
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p password 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  importer:
    build:
      context: ../..
      dockerfile: chapters/ch05_a/Dockerfile
    image: ch05_a-importer
    profiles: ["run"]   # not started by `up`; used via `docker compose run`
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
    volumes:
      - ../../data:/app/data   # BBC dataset in, Wikidata caches (cache_org, cache_owners) written back

  # Runs the spaCy dependency-parse demo (listings/5a.1) and serves the diagram at http://localhost:5000
  #   docker compose run --rm --service-ports depparse     (stop with Ctrl+C)
  depparse:
    image: ch05_a-importer
    profiles: ["run"]
    working_dir: /app/chapters/ch05_a/listings
    command: ["python", "5a.1 - NLP with dependency parsing.py"]
    ports:
      - "5000:5000"
    volumes:
      - ./listings:/app/chapters/ch05_a/listings

  # Runs the spaCy NER demo (listings/5a.2); entities highlighted at http://localhost:5001
  #   docker compose run --rm --service-ports nerdemo     (stop with Ctrl+C)
  nerdemo:
    image: ch05_a-importer
    profiles: ["run"]
    working_dir: /app/chapters/ch05_a/listings
    command: ["python", "5a.2 - NER pipeline.py"]
    ports:
      - "5001:5000"   # displaCy always listens on 5000 inside the container; host port differs so both demos can run
    volumes:
      - ./listings:/app/chapters/ch05_a/listings

  # Runs the rule-based NER demo (listings/5a.3); entities highlighted at http://localhost:5002
  #   docker compose run --rm --service-ports rulerdemo     (stop with Ctrl+C)
  rulerdemo:
    image: ch05_a-importer
    profiles: ["run"]
    working_dir: /app/chapters/ch05_a/listings
    command: ["python", "5a.3 - Dictionary-based NER.py"]
    ports:
      - "5002:5000"
    volumes:
      - ./listings:/app/chapters/ch05_a/listings

volumes:
  neo4j_data:
