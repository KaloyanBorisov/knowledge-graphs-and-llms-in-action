# Usage:  docker compose up -d neo4j   (browser: http://localhost:7474, login neo4j / password)
#         docker compose run --rm importer   (runs the 3 import steps once Neo4j is healthy)
# Then run the Cypher in listings/ (e.g. 6.11 - 6.16) in Neo4j Browser. GDS is installed for 6.13/6.14.
name: ch05_a
services:
  neo4j:
    image: neo4j:5-community
    container_name: ch05_a-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/password            # matches ../../config.ini
      NEO4J_PLUGINS: '["graph-data-science"]'
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p password 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  importer:
    build:
      context: ../..
      dockerfile: chapters/ch05_a/Dockerfile
    image: ch05_a-importer
    profiles: ["run"]   # not started by `up`; used via `docker compose run`
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
    volumes:
      - ../../data:/app/data   # BBC dataset in, Wikidata caches (cache_org, cache_owners) written back

volumes:
  neo4j_data:
