# Setup:  cp .env.example .env  (then set OPENAI_API_KEY), then:  docker compose up -d --build
# Starts a long-lived container (visible under Containers in Docker Desktop) to run the listings in:
#   docker compose exec workbench python listing_3.py
# One-shot alternative that is removed on exit:  docker compose run --rm extract
name: ch05_b
services:
  workbench:
    build: .
    image: ch05_b-extract
    container_name: ch05_b-workbench
    command: sleep infinity
    env_file: .env
    volumes:
      - ./listings:/app/listings   # edit listings (e.g. the prompt import in listing_3.py) without rebuilding

  extract:
    build: .
    image: ch05_b-extract
    profiles: ["run"]   # not started by `up`; only used by `docker compose run`
    env_file: .env
    volumes:
      - ./listings:/app/listings
