# Setup:  cp .env.example .env  (set OPENAI_KEY; optional - without it only cached LLM answers are used)
# Usage:  docker compose up -d --build     (starts Neo4j; the importer starts once it is healthy and runs the pipeline once)
#         docker logs -f ch06-importer      (pipeline log; the stopped container and its log are kept after it finishes)
#         docker compose up -d --force-recreate importer   (run the pipeline again; the old importer log is replaced)
#         docker compose logs -f neo4j      (database log)
# Neo4j browser: http://localhost:7474, login neo4j / password
# Then run the Cypher in listings/ in Neo4j Browser.
name: ch06
services:
  neo4j:
    image: neo4j:5-community
    container_name: ch06-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/password            # matches ../../config.ini
      # APOC (apoc.convert / apoc.merge / apoc.text) and Graph Data Science (WCC, PageRank, Louvain ...)
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*,gds.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.*,gds.*"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p password 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  importer:
    build:
      context: ../..
      dockerfile: chapters/ch06/Dockerfile
    image: ch06-importer
    container_name: ch06-importer
    restart: "no"   # run the pipeline once; the exited container (and its logs) stays visible in `docker ps -a`
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      # Values come from .env in this folder (compose reads it automatically); defaults if unset
      OPENAI_KEY: ${OPENAI_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ../../data:/app/data   # diaries + prompts in, LLM cache (data/cache_llm) written back

volumes:
  neo4j_data:
