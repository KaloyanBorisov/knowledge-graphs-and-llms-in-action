# Setup:  cp .env.example .env  (then set a password), then:  docker compose up --build
# Pipeline: neo4j -> importer (restore ppi seed) -> prepare (listings 4.7-4.10) -> analysis (plots in ./analysis)
services:
  neo4j:
    image: neo4j:5.26.0-enterprise   # Enterprise is needed for CREATE DATABASE
    environment:
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "eval"
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      DB_PASSWORD: ${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: "gds.*"
      NEO4J_dbms_security_procedures_allowlist: "gds.*"
      NEO4J_dbms_databases_seed__from__uri__providers: "URLConnectionSeedProvider"
      NEO4J_server_memory_heap_max__size: "2G"
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$$DB_PASSWORD\" 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30

  importer:
    build:
      context: ../..
      dockerfile: chapters/ch04/Dockerfile
    depends_on:
      neo4j:
        condition: service_healthy
    environment: &neo4j_env
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}

  prepare:
    image: neo4j:5.26.0-enterprise   # reused only for cypher-shell
    entrypoint: ["/bin/bash", "/prepare_gds.sh"]
    volumes:
      - ./prepare_gds.sh:/prepare_gds.sh:ro
    depends_on:
      importer:
        condition: service_completed_successfully
    environment: *neo4j_env

  analysis:
    build:
      context: ../..
      dockerfile: chapters/ch04/Dockerfile
    command: >
      sh -c "python chapters/ch04/analysis/louvain_cluster_analysis.py &&
             python chapters/ch04/analysis/multiomic_analysis.py"
    volumes:
      - ./analysis:/app/chapters/ch04/analysis   # plots are written back here
    depends_on:
      prepare:
        condition: service_completed_successfully
    environment: *neo4j_env

volumes:
  neo4j_data:
